# ============================================================================
# Shared Reusable Workflow: Fix PR Reviews with Bob
# ============================================================================
#
# PURPOSE:
# Automatically addresses PR review comments using IBM Bob Shell.
# This workflow is triggered by the local `fix-pr-reviews-with-bob-trigger.yml`
# in each repo via workflow_run (to access secrets from forked PRs).
#
# REQUIRED SECRETS (passed via `secrets: inherit` from caller):
#   BOBSHELL_API_KEY      — Bob Shell API key
#   SKILLBERRY_BOT_TOKEN  — PAT with pull-requests write permission
#
# USAGE (in caller repo):
#   jobs:
#     call-fix-pr-reviews:
#       uses: skillberry-ai/skillberry-common/.github/workflows/fix-pr-reviews-with-bob.yml@main
#       secrets: inherit
# ============================================================================

name: Fix PR Reviews with Bob (shared)

on:
  workflow_call:

jobs:
  fix-pr-reviews-with-bob:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write
      deployments: write
      statuses: write
      actions: write
      checks: read

    steps:
      - name: Get PR details from workflow run
        id: get_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SKILLBERRY_BOT_TOKEN }}
          script: |
            const workflowRun = context.payload.workflow_run;

            core.info(`Workflow run ID: ${workflowRun.id}`);
            core.info(`Workflow run head SHA: ${workflowRun.head_sha}`);
            core.info(`Workflow run head branch: ${workflowRun.head_branch}`);

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: workflowRun.id,
              per_page: 100
            });

            const payloadArtifact = artifacts.artifacts?.find(artifact => artifact.name === 'pr-review-context');
            if (!payloadArtifact) {
              core.setFailed('Could not find pr-review-context artifact on trigger workflow run');
              return;
            }

            core.info(`Found artifact ${payloadArtifact.name} (${payloadArtifact.id})`);

            const zipResponse = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: payloadArtifact.id,
              archive_format: 'zip'
            });

            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'bob-pr-review-'));
            const zipPath = path.join(tempDir, 'artifact.zip');
            const zipBuffer = Buffer.isBuffer(zipResponse.data)
              ? zipResponse.data
              : Buffer.from(zipResponse.data);
            fs.writeFileSync(zipPath, zipBuffer);
            execFileSync('unzip', ['-o', zipPath, '-d', tempDir], { stdio: 'inherit' });

            const payloadPath = path.join(tempDir, 'pr-review-context.json');
            const payload = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));

            core.info(`Loaded PR #${payload.pr_number} review ${payload.review_id} from trigger artifact`);

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: payload.pr_number
            });

            const hasLabel = pr.labels.some(label => label.name === 'fix-with-bob');
            if (!hasLabel) {
              core.info('PR does not have fix-with-bob label, skipping');
              core.setOutput('should_run', 'false');
              return;
            }

            const { data: review } = await github.rest.pulls.getReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: payload.pr_number,
              review_id: payload.review_id
            });

            if (review.state !== 'COMMENTED' && review.state !== 'CHANGES_REQUESTED') {
              core.info(`Review state ${review.state} is not actionable, skipping`);
              core.setOutput('should_run', 'false');
              return;
            }

            core.setOutput('should_run', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('pr_title', pr.title);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('review_id', String(review.id));
            core.setOutput('reviewer', review.user.login);

            core.info(`Will process PR #${pr.number}: ${pr.title}`);
            core.info(`Review ID: ${review.id} by ${review.user.login}`);

      - name: Checkout repository
        if: steps.get_pr.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.get_pr.outputs.head_repo }}
          ref: ${{ steps.get_pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.SKILLBERRY_BOT_TOKEN }}

      - name: Setup Node.js
        if: steps.get_pr.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bob Shell
        if: steps.get_pr.outputs.should_run == 'true'
        run: |
          echo "Installing Bob Shell..."
          # Pinned to 1.0.6: Bob Shell 2.x hangs indefinitely on non-interactive
          # `bob --accept-license -p ...` invocations (no TTY on GitHub-hosted
          # runners). Revisit the pin once 2.x's non-interactive mode is
          # confirmed fixed.
          curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash -s -- --package-manager npm --version 1.0.6

          if command -v bob &> /dev/null; then
            echo "Bob Shell installed successfully"
            bob --version
          else
            echo "Bob Shell installation failed"
            exit 1
          fi

      - name: Authenticate Bob Shell
        if: steps.get_pr.outputs.should_run == 'true'
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
        run: |
          echo "Configuring Bob Shell authentication..."
          if [ -z "$BOBSHELL_API_KEY" ]; then
            echo "Error: BOBSHELL_API_KEY secret is not set"
            exit 1
          fi
          echo "Bob Shell authentication configured successfully"

      - name: Get PR and Review Details
        if: steps.get_pr.outputs.should_run == 'true'
        id: pr_details
        env:
          GITHUB_TOKEN: ${{ secrets.SKILLBERRY_BOT_TOKEN }}
          # PR_TITLE/REVIEWER are read via env: and re-exported below via $VAR
          # (not spliced in with a double-brace GitHub Actions expression)
          # because pr_title is attacker-controlled text: GitHub Actions
          # substitutes those expressions into the script's source text
          # before bash ever parses it, so a stray quote in the title would
          # otherwise break out of the echo and execute as shell here.
          PR_TITLE: ${{ steps.get_pr.outputs.pr_title }}
          REVIEWER: ${{ steps.get_pr.outputs.reviewer }}
        run: |
          PR_NUMBER="${{ steps.get_pr.outputs.pr_number }}"
          REVIEW_ID="${{ steps.get_pr.outputs.review_id }}"

          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          {
            echo "pr_title<<PR_TITLE_EOF"
            echo "${PR_TITLE}"
            echo "PR_TITLE_EOF"
          } >> $GITHUB_OUTPUT
          echo "review_id=${REVIEW_ID}" >> $GITHUB_OUTPUT
          echo "reviewer=${REVIEWER}" >> $GITHUB_OUTPUT

          echo "Fetching review comments..."
          COMMENTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/comments" \
            --jq '.[] | "File: \(.path)\nLine: \(.line // .original_line)\nComment: \(.body)\n---"')

          echo "${COMMENTS}" > /tmp/review_comments.txt

          REVIEW_BODY=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" \
            --jq '.body // ""')

          if [ -n "${REVIEW_BODY}" ]; then
            echo "Review Summary: ${REVIEW_BODY}" >> /tmp/review_comments.txt
          fi

          echo "Review comments saved to /tmp/review_comments.txt"
          cat /tmp/review_comments.txt

      - name: Configure Git
        if: steps.get_pr.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Bob to Address Review Comments
        if: steps.get_pr.outputs.should_run == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            REVIEW_COMMENTS=$(cat /tmp/review_comments.txt)

            # PR_NUMBER/PR_TITLE/REPOSITORY/REVIEWER come from env: below and
            # are referenced as $VAR rather than spliced in with a
            # double-brace GitHub Actions expression, since pr_title is
            # attacker-controlled text and this is a double-quoted bash
            # string - GitHub Actions substitutes those expressions into the
            # script's source text before bash ever parses it, so a stray
            # quote/backtick/$() in the title would otherwise break out of
            # this string and execute as shell in this job (which holds
            # BOBSHELL_API_KEY and SKILLBERRY_BOT_TOKEN with contents: write).
            PROMPT="Address PR review comments for PR #${PR_NUMBER}: ${PR_TITLE}

            Repository: ${REPOSITORY}
            Reviewer: ${REVIEWER}

            Review Comments:
            ${REVIEW_COMMENTS}

            Please analyze all the review comments above and make the necessary code changes to address each point of feedback.
            For each comment:
            1. Understand the concern or suggestion
            2. Make the appropriate code changes
            3. Ensure the changes follow best practices
            4. Make sure all related code is updated consistently

            Be thorough and address every comment. If a comment is unclear or requires clarification, make your best judgment based on the context."

            # --accept-license: required on first run in a fresh CI environment
            # --yolo: required to enable file writing (disabled by default)
            bob --accept-license --yolo -p "${PROMPT}"
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.SKILLBERRY_BOT_TOKEN }}
          PR_NUMBER: ${{ steps.pr_details.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr_details.outputs.pr_title }}
          REVIEWER: ${{ steps.pr_details.outputs.reviewer }}
          REPOSITORY: ${{ github.repository }}

      - name: Check for Changes
        if: steps.get_pr.outputs.should_run == 'true'
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --short

            CHANGED_FILES=$(git diff --name-only | tr '\n' ', ' | sed 's/,$//')
            echo "changed_files=${CHANGED_FILES}" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and Push Changes
        if: steps.get_pr.outputs.should_run == 'true' && steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SKILLBERRY_BOT_TOKEN }}
        run: |
          git add -A
          git reset .bob/ || true
          git commit -m "Address review comments from @${{ steps.pr_details.outputs.reviewer }}

          Automatically generated by Bob Shell to address review feedback.
          Review ID: ${{ steps.pr_details.outputs.review_id }}"

          # Push to the PR branch
          git push

      - name: Generate Responses for Review Comments
        if: steps.get_pr.outputs.should_run == 'true' && steps.changes.outputs.has_changes == 'true'
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.SKILLBERRY_BOT_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr_details.outputs.pr_number }}"
          REVIEW_ID="${{ steps.pr_details.outputs.review_id }}"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/comments" \
            --jq '.[] | {id: .id, path: .path, line: (.line // .original_line), body: .body}' > /tmp/comments.json

          jq -c '.' /tmp/comments.json | while read -r comment; do
            COMMENT_ID=$(echo "$comment" | jq -r '.id')
            COMMENT_PATH=$(echo "$comment" | jq -r '.path')
            COMMENT_LINE=$(echo "$comment" | jq -r '.line')
            COMMENT_BODY=$(echo "$comment" | jq -r '.body')

            echo "Processing comment ${COMMENT_ID} on ${COMMENT_PATH}:${COMMENT_LINE}"

            FILE_DIFF=$(git diff HEAD~1 HEAD -- "${COMMENT_PATH}" 2>/dev/null || echo "File changes not available")

            RESPONSE_PROMPT="Generate a brief, polite, and professional response to this code review comment.

          Review Comment:
          File: ${COMMENT_PATH}
          Line: ${COMMENT_LINE}
          Comment: ${COMMENT_BODY}

          Changes Made to This File:
          ${FILE_DIFF}

          Write a response that:
          1. Acknowledges the reviewer's feedback
          2. Briefly explains what changes were made to address it (1-2 sentences)
          3. Is polite and professional
          4. Does not include greetings or sign-offs
          5. Is concise (2-3 sentences maximum)

          Response:"

            RESPONSE=$(bob -p "${RESPONSE_PROMPT}" 2>/dev/null | head -n 10)

            if [ -z "${RESPONSE}" ] || [ ${#RESPONSE} -gt 500 ]; then
              RESPONSE="Thank you for the feedback. I've updated the code in ${COMMENT_PATH} to address your concern. Please review the changes."
            fi

            echo "${COMMENT_ID}|${RESPONSE}" >> /tmp/responses.txt
          done

      - name: Post Responses to Review Comments
        if: steps.get_pr.outputs.should_run == 'true' && steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SKILLBERRY_BOT_TOKEN }}
          # REVIEWER/CHANGED_FILES come from env: and are referenced as $VAR
          # below rather than spliced in with a double-brace GitHub Actions
          # expression. changed_files is built from filenames in the PR, and
          # GitHub Actions substitutes that expression into this script's
          # source text before bash parses it - so a filename containing a
          # single quote could otherwise break out of the string being built
          # below and execute as shell in this job.
          REVIEWER: ${{ steps.pr_details.outputs.reviewer }}
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
        run: |
          PR_NUMBER="${{ steps.pr_details.outputs.pr_number }}"

          if [ -f /tmp/responses.txt ]; then
            while IFS='|' read -r COMMENT_ID RESPONSE; do
              echo "Posting response to comment ${COMMENT_ID}"
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments/${COMMENT_ID}/replies" \
                -f body="✅ ${RESPONSE}" || echo "Failed to reply to comment ${COMMENT_ID}"
            done < /tmp/responses.txt
          fi

          echo "Posting general comment to PR #${PR_NUMBER}"
          # Built with printf %s rather than $'...' interpolation of GitHub
          # Actions expressions: REVIEWER/CHANGED_FILES are passed as
          # separate arguments, so their content can't be re-parsed as shell
          # no matter what characters (quotes, backticks) a PR's filenames
          # contain.
          GENERAL_COMMENT=$(printf 'Thank you @%s for the review! I'\''ve addressed all the comments and updated the following files:\n\n**Changed files:** %s\n\nPlease let me know if any further changes are needed.' "${REVIEWER}" "${CHANGED_FILES}")
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -f body="${GENERAL_COMMENT}" || echo "Failed to post general comment"

      - name: Comment on PR - No Changes
        if: steps.get_pr.outputs.should_run == 'true' && steps.changes.outputs.has_changes == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.SKILLBERRY_BOT_TOKEN }}
          PR_NUMBER: ${{ steps.pr_details.outputs.pr_number }}
          REVIEWER: ${{ steps.pr_details.outputs.reviewer }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -f body="🤖 Bob Shell analyzed the review comments from @${REVIEWER} but did not generate any code changes. The comments may require manual intervention or clarification."

      - name: Handle Errors
        if: steps.get_pr.outputs.should_run == 'true' && failure()
        env:
          GITHUB_TOKEN: ${{ secrets.SKILLBERRY_BOT_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/issues/${{ steps.pr_details.outputs.pr_number }}/comments" \
            -f body="❌ Bob Shell encountered an error while trying to address the review comments. Please check the workflow logs for details."

# Made with Bob
